name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - release
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Assets
        run: |
          chmod +x android/gradlew
          echo "=== Node version ==="
          node --version
          echo "=== Cap CLI location ==="
          ls -la node_modules/.bin/cap || echo "cap not found in node_modules/.bin"
          ls -la node_modules/@capacitor/cli/bin/capacitor.js || echo "capacitor.js not found"
          echo "=== capacitor.settings.gradle ==="
          cat android/capacitor.settings.gradle
          echo "=== Running cap sync ==="
          node node_modules/@capacitor/cli/bin/capacitor.js sync android --verbose 2>&1 || true
          echo "=== Checking if assets were copied ==="
          ls -la android/app/src/main/assets/ || echo "assets dir missing"
          ls android/app/src/main/assets/public/ | head -10 || echo "public dir missing"

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavern-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
