name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - release
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Assets
        run: |
          set +e
          chmod +x android/gradlew
          echo "=== Node version ===" >> sync_debug.log
          node --version >> sync_debug.log 2>&1
          echo "=== Cap CLI check ===" >> sync_debug.log
          ls -la node_modules/.bin/cap >> sync_debug.log 2>&1
          ls -la node_modules/@capacitor/cli/bin/capacitor.js >> sync_debug.log 2>&1
          echo "=== capacitor.settings.gradle ===" >> sync_debug.log
          cat android/capacitor.settings.gradle >> sync_debug.log 2>&1
          echo "=== capacitor.config.json ===" >> sync_debug.log
          cat capacitor.config.json >> sync_debug.log 2>&1
          echo "=== Running cap sync ===" >> sync_debug.log
          node node_modules/@capacitor/cli/bin/capacitor.js sync android 2>&1 | tee -a sync_debug.log
          SYNC_EXIT=$?
          echo "=== cap sync exit code: $SYNC_EXIT ===" >> sync_debug.log
          echo "=== Assets check ===" >> sync_debug.log
          ls -laR android/app/src/main/assets/ >> sync_debug.log 2>&1 || true
          echo "=== Res xml check ===" >> sync_debug.log
          ls -la android/app/src/main/res/xml/ >> sync_debug.log 2>&1 || true
          cat sync_debug.log
          exit $SYNC_EXIT

      - name: Upload Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-debug-log
          path: sync_debug.log
          retention-days: 3

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavern-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
