name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - release
      - claude/android-apk-black-screen-6qav4d
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          npm install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Only install what the build needs. The action's default package set
          # includes the deprecated "tools" package, whose download has been
          # failing on the runners ("Error on ZipFile unknown archive"), which
          # aborted the whole job before Gradle ever ran.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor Assets
        run: |
          chmod +x android/gradlew
          mkdir -p android/app/src/main/assets/public
          cp -r public/* android/app/src/main/assets/public/

      - name: Bundle web libraries (webpack)
        # public/lib.js imports npm packages (lodash, fuse.js, ...) that the
        # browser can't resolve as bare specifiers. The server normally bundles
        # this on the fly; for the APK we must do it at build time. This
        # overwrites the copied raw lib.js with a self-contained ES module.
        run: |
          node build-mobile-lib.mjs

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug 2>&1 | tee ../gradle_build.log
        
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log
          retention-days: 3

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SillyTavern-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
